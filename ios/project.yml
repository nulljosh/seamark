name: Seamark
options:
  bundleIdPrefix: com.nulljosh
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "202609012100"

targets:
  Seamark-iOS:
    type: application
    # One target, two destinations (the charwork/wordroot pattern); no platform-specific sources.
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.seamark
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: QMM486NPYC
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Seamark.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Seamark-macOS.entitlements

schemes:
  Seamark-iOS:
    build:
      targets:
        Seamark-iOS: all
    run:
      config: Debug
    archive:
      config: Release
    shared: true
